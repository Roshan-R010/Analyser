id: iob
name: Indian Overseas Bank
detect:
  header: ['\bIOBA0\d{6}\b', 'Indian Overseas Bank']
details:
  holder:
    # Older layout: "Account Number - <number> <NAME START> <BRANCH> (<branch code>)", the name
    # continuing on the next line: join the part after the number with the next line.
    - 'Account Number\s*-\s*\d+\s+(?P<h1>.+?)\s+\S+\s+\(\d+\)\s*\n(?P<h2>[^\n:]+)$'
    # Newer layout: "Account No : <NAME> , <street address>"
    - 'Account No\s*:\s*(?P<h>[A-Z][A-Z0-9 .&]+?)\s*,'
  account_no:
    - '^:\s*(\d{10,})\s*$'      # newer layout: the number sits alone on the line before "Account No"
reader:
  columns:
    '^date value date$': date    # the newer layout stacks "Date (Value Date)" over two lines
